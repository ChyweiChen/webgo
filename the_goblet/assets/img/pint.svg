<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 780" width="620" height="780" role="img" aria-label="Illustration of a pint of stout on a wooden bar">
<defs>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3A2416"/>
    <stop offset=".5" stop-color="#6B452A"/>
    <stop offset="1" stop-color="#2B1A10"/>
  </linearGradient>
  <linearGradient id="stout" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0A0706"/>
    <stop offset=".28" stop-color="#241812"/>
    <stop offset=".62" stop-color="#1B120D"/>
    <stop offset="1" stop-color="#080504"/>
  </linearGradient>
  <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF9EC"/>
    <stop offset=".6" stop-color="#F3E7CE"/>
    <stop offset="1" stop-color="#DBC7A4"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8A6A31"/>
    <stop offset=".35" stop-color="#E7C888"/>
    <stop offset=".7" stop-color="#C8A45C"/>
    <stop offset="1" stop-color="#6E5226"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".42" r=".62">
    <stop offset="0" stop-color="#F0C77A" stop-opacity=".42"/>
    <stop offset=".55" stop-color="#C88F45" stop-opacity=".16"/>
    <stop offset="1" stop-color="#C88F45" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/>
    <stop offset=".18" stop-color="#FFFFFF" stop-opacity=".06"/>
    <stop offset=".8" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".18"/>
  </linearGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>

  <clipPath id="arch"><path d="M42 770 V262 C42 128 148 34 310 34 C472 34 578 128 578 262 V770 Z"/></clipPath>
</defs>

<rect width="620" height="780" fill="#0A1C15"/>
<rect x="16" y="16" width="588" height="748" rx="8" fill="none" stroke="#C8A45C" stroke-opacity=".35" stroke-width="1.5"/>

<g clip-path="url(#arch)">
  <rect x="42" y="34" width="536" height="736" fill="url(#wood)"/>
  <rect x="42.0" y="34" width="1.6" height="700" fill="#000" opacity="0.05"/><rect x="83.2" y="34" width="1.6" height="700" fill="#000" opacity="0.08"/><rect x="124.5" y="34" width="1.6" height="700" fill="#000" opacity="0.10"/><rect x="165.7" y="34" width="1.6" height="700" fill="#000" opacity="0.12"/><rect x="206.9" y="34" width="1.6" height="700" fill="#000" opacity="0.05"/><rect x="248.2" y="34" width="1.6" height="700" fill="#000" opacity="0.08"/><rect x="289.4" y="34" width="1.6" height="700" fill="#000" opacity="0.10"/><rect x="330.6" y="34" width="1.6" height="700" fill="#000" opacity="0.12"/><rect x="371.8" y="34" width="1.6" height="700" fill="#000" opacity="0.05"/><rect x="413.1" y="34" width="1.6" height="700" fill="#000" opacity="0.08"/><rect x="454.3" y="34" width="1.6" height="700" fill="#000" opacity="0.10"/><rect x="495.5" y="34" width="1.6" height="700" fill="#000" opacity="0.12"/><rect x="536.8" y="34" width="1.6" height="700" fill="#000" opacity="0.05"/>
  <ellipse cx="310" cy="300" rx="300" ry="290" fill="url(#glow)"/>

  <!-- suggestion of a back bar with shelves and bottles -->
  <g opacity=".45">
    <rect x="70" y="150" width="480" height="7" fill="#9A6C42"/>
    <rect x="70" y="232" width="480" height="7" fill="#9A6C42"/>
  </g>
  <g fill="#1A1009" opacity=".6">
    <rect x="96" y="96" width="18" height="54" rx="5"/><rect x="126" y="108" width="16" height="42" rx="4"/>
    <rect x="466" y="96" width="18" height="54" rx="5"/><rect x="496" y="110" width="15" height="40" rx="4"/>
    <rect x="150" y="180" width="17" height="52" rx="5"/><rect x="446" y="184" width="17" height="48" rx="5"/>
  </g>

  <!-- hanging glasses -->
  <g stroke="#F6EBD6" stroke-opacity=".32" stroke-width="2" fill="none">
    <path d="M210 106 v56 c0 22 12 34 24 34 s24-12 24-34 v-56"/>
    <path d="M362 106 v56 c0 22 12 34 24 34 s24-12 24-34 v-56"/>
  </g>

  <!-- warm lamp -->
  <circle cx="310" cy="118" r="9" fill="#E7C888"/>
  <path d="M268 128 h84 l-16-28 h-52 Z" fill="url(#brass)"/>
  <ellipse cx="310" cy="150" rx="120" ry="70" fill="#FFD58A" opacity=".10" filter="url(#soft)"/>

  <!-- bar counter in perspective -->
  <path d="M42 592 H578 V770 H42 Z" fill="url(#wood)"/>
  <path d="M42 592 H578 V606 H42 Z" fill="#9A6C42" opacity=".75"/>
  <rect x="42.0" y="606" width="1.6" height="164" fill="#000" opacity="0.05"/><rect x="101.6" y="606" width="1.6" height="164" fill="#000" opacity="0.08"/><rect x="161.1" y="606" width="1.6" height="164" fill="#000" opacity="0.10"/><rect x="220.7" y="606" width="1.6" height="164" fill="#000" opacity="0.12"/><rect x="280.2" y="606" width="1.6" height="164" fill="#000" opacity="0.05"/><rect x="339.8" y="606" width="1.6" height="164" fill="#000" opacity="0.08"/><rect x="399.3" y="606" width="1.6" height="164" fill="#000" opacity="0.10"/><rect x="458.9" y="606" width="1.6" height="164" fill="#000" opacity="0.12"/><rect x="518.4" y="606" width="1.6" height="164" fill="#000" opacity="0.05"/>

  <!-- the pint -->
  <g>
    <ellipse cx="310" cy="694" rx="128" ry="24" fill="#000" opacity=".45"/>
    <path d="M214 356 L226 660 Q228 684 254 686 H366 Q392 684 394 660 L406 356 Z" fill="url(#stout)"/>
    <path d="M214 356 L226 660 Q228 684 254 686 H366 Q392 684 394 660 L406 356 Z" fill="url(#glass)"/>
    <!-- cream head, slightly domed and overflowing -->
    <path d="M210 356 C210 330 230 316 258 322 C274 302 300 300 314 314 C334 296 364 306 370 326 C392 322 408 336 406 358 C404 376 380 382 310 382 C240 382 212 374 210 356 Z" fill="url(#foam)"/>
    <path d="M226 350 C246 340 268 348 286 342 C310 334 330 348 352 342 C370 338 384 344 392 352" fill="none" stroke="#FFFDF6" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
    <!-- glass highlights -->
    <path d="M232 392 L242 646" stroke="#FFF" stroke-opacity=".20" stroke-width="10" stroke-linecap="round"/>
    <path d="M386 400 L380 620" stroke="#FFF" stroke-opacity=".10" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="310" cy="686" rx="84" ry="11" fill="#000" opacity=".3"/>
  </g>
</g>

<!-- brass arch outline -->
<path d="M42 770 V262 C42 128 148 34 310 34 C472 34 578 128 578 262 V770" fill="none" stroke="url(#brass)" stroke-width="5"/>
<path d="M58 770 V262 C58 138 156 50 310 50 C464 50 562 138 562 262 V770" fill="none" stroke="#C8A45C" stroke-opacity=".35" stroke-width="1.2"/>

  <g transform="translate(310 740) scale(0.72)" opacity="0.85" fill="#C8A45C">
    <circle cx="-9" cy="-6" r="9"/><circle cx="9" cy="-6" r="9"/>
    <circle cx="0" cy="8" r="9"/>
    <path d="M0 12 C1 24 5 30 9 34" fill="none" stroke="#C8A45C" stroke-width="3" stroke-linecap="round"/>
  </g>
<rect width="620" height="780" filter="url(#grain)" opacity=".045"/>
</svg>