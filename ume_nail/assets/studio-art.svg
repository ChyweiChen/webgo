<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FBF8F3"/><stop offset="1" stop-color="#F4EDE2"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="35%" r="65%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#CE9F82"/><stop offset=".42" stop-color="#E4BBA0"/>
    <stop offset=".78" stop-color="#F0CFB6"/><stop offset="1" stop-color="#CE9F82"/>
  </linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2B3E63"/><stop offset=".55" stop-color="#1B2A47"/>
    <stop offset="1" stop-color="#12203A"/>
  </linearGradient>
  <linearGradient id="nude" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FBEAE0"/><stop offset=".55" stop-color="#F6DED0"/>
    <stop offset="1" stop-color="#E9C6B6"/>
  </linearGradient>
  <linearGradient id="milky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F8F1E9"/>
    <stop offset="1" stop-color="#E9DAC9"/>
  </linearGradient>
  <pattern id="dots" width="27" height="27" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="8" r="4.3" fill="#FFFFFF" opacity=".95"/>
    <circle cx="21" cy="20" r="3.1" fill="#FFFFFF" opacity=".88"/>
    <circle cx="24" cy="3" r="1.7" fill="#FFFFFF" opacity=".7"/>
  </pattern>
  <pattern id="dotsFine" width="19" height="19" patternUnits="userSpaceOnUse">
    <circle cx="6" cy="6" r="3" fill="#FFFFFF" opacity=".95"/>
    <circle cx="15" cy="15" r="2.2" fill="#FFFFFF" opacity=".85"/>
  </pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4A3B2A" flood-opacity=".16"/>
  </filter>
  <filter id="softSmall" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#4A3B2A" flood-opacity=".14"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  
</defs>

